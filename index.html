<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Registration</title>
<style>
  :root { --ink:#111827; --muted:#6b7280; --brand:#2563eb; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:#f8fafc; padding:24px;
  }
  .card {
    width:100%; max-width:420px; background:#fff; border:1px solid #e5e7eb;
    border-radius:16px; padding:32px 28px; text-align:center;
    box-shadow:0 10px 30px rgba(15,23,42,.06);
  }
  h1 { font-size:22px; margin:0 0 8px; letter-spacing:-.01em; }
  p { margin:0 0 22px; color:var(--muted); font-size:15px; }
  a.btn {
    display:inline-block; background:var(--brand); color:#fff; text-decoration:none;
    font-weight:600; padding:13px 26px; border-radius:10px;
  }
  a.btn:active { transform:translateY(1px); }
  .spin {
    width:22px; height:22px; margin:0 auto 18px; border-radius:50%;
    border:3px solid #e5e7eb; border-top-color:var(--brand); animation:s .8s linear infinite;
  }
  @keyframes s { to { transform:rotate(360deg); } }
  .url { margin-top:20px; font-size:12px; color:#9ca3af; word-break:break-all; }
  @media print { .spin, .url { display:none; } body { background:#fff; } .card { box-shadow:none; } }
</style>
</head>
<body>
  <main class="card">
    <div class="spin" aria-hidden="true"></div>
    <h1 id="title">Meeting Registration</h1>
    <p id="note">Taking you to the registration form...</p>
    <a class="btn" id="go" href="#" rel="noopener">Open the form</a>
    <div class="url" id="url"></div>
  </main>

  <script src="config.js"></script>
  <script>
    (function () {
      var cfg = window.MEETING || {};
      var url = (cfg.formUrl || "").trim();

      document.title = cfg.title || document.title;
      document.getElementById("title").textContent = cfg.title || "Meeting Registration";
      document.getElementById("note").textContent = cfg.note || "Taking you to the registration form...";
      document.getElementById("go").textContent = cfg.buttonText || "Open the form";

      if (!url || url.indexOf("PASTE-YOUR-FORM-ID") !== -1) {
        document.getElementById("note").textContent =
          "No form link has been set yet. Edit config.js to add one.";
        document.querySelector(".spin").style.display = "none";
        return;
      }

      document.getElementById("go").href = url;
      try { document.getElementById("url").textContent = new URL(url).hostname; } catch (e) {}

      // Auto-forward shortly after paint so visitors can still tap the button.
      setTimeout(function () { window.location.replace(url); }, 1200);
    })();
  </script>
</body>
</html>
